[project]
name = "penpaw-server"
version = "0.1.0"
description = "PenPaw FastAPI service (upload / preview / optimize / export)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "pydantic-settings>=2",
    "penpaw-pipeline",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
penpaw-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
