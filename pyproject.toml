[project]
name = "penpaw"
version = "0.1.0"
description = "PenPaw Neural Vector Engine - monorepo workspace root"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/server", "packages/pipeline", "packages/eval"]

[tool.uv.sources]
penpaw-pipeline = { workspace = true }
penpaw-eval = { workspace = true }
penpaw-server = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008：FastAPI 官方推荐的 Depends() 默认参数模式
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["apps/server/tests", "packages/pipeline/tests"]
markers = [
    "slow: 真实模型（SAM/DINOv2）集成测试，需权重就位（scripts/download_models.py）；用 -m 'not slow' 跳过",
]
